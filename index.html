<!DOCTYPE html>
<html>
<head>
    <title>我的記帳系統</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .expense-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>
    <!-- Dashboard 統計面板 -->
    <div class="card" style="display: flex; justify-content: space-around; text-align: center;">
        <div>
            <h3 style="color: #666; margin-bottom: 5px;">今日支出</h3>
            <h2 id="todayTotal" style="color: #dc3545; margin-top: 0;">$0</h2>
        </div>
        <div>
            <h3 style="color: #666; margin-bottom: 5px;">本月支出</h3>
            <h2 id="monthTotal" style="color: #dc3545; margin-top: 0;">$0</h2>
        </div>
    </div>
    <!-- 匯出按鈕 -->
    <button onclick="window.location.href='/export/excel'" style="background-color: #28a745; margin-bottom: 20px; font-size: 16px;">
        📊 下載 Excel 報表
    </button>   

    <div class="card">
        <h2>新增記帳</h2>
        <form id="expenseForm">
            <input type="number" id="amount" placeholder="金額 (例如: 150)" required>
            <select id="category">
                <option value="飲食">飲食</option>
                <option value="交通">交通</option>
                <option value="生活">生活</option>
            </select>
            <input type="text" id="subcategory" placeholder="子分類 (例如: 午餐、飲料)">
            <input type="text" id="merchant" placeholder="商家 (例如: 麥當勞、全聯)">
            <select id="payment_method">
                <option value="現金">現金</option>
                <option value="信用卡">信用卡</option>
                <option value="LINE Pay">LINE Pay</option>
            </select>
            <input type="text" id="note" placeholder="備註 (例如: 麻辣鍋、買牛奶)">
            <button type="submit">新增記帳！</button>
        </form>
    </div>

    <div class="card">
        <h2>最近交易</h2>
        <div id="transactionList"></div>
    </div>

    <script>
        // 1. 讀取統計數據並更新畫面 (這個要放在最前面)
        async function loadStatistics() {
            const response = await fetch('/statistics');
            const data = await response.json();
            document.getElementById('todayTotal').innerText = `$${data.today_total}`;
            document.getElementById('monthTotal').innerText = `$${data.month_total}`;
        }

        // 2. 取得所有交易紀錄並顯示在畫面上
        async function loadTransactions() {
            const response = await fetch('/transactions');
            const data = await response.json();
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            
            data.forEach(t => {
                list.innerHTML += `
                    <div class="expense-item" style="align-items: center;">
                        <span style="flex-grow: 1;">${t.date} | [${t.category}] ${t.merchant || '無商家'} - ${t.note || '無備註'}</span>
                        <span style="color: red; font-weight: bold; margin-right: 15px;">$${t.amount}</span>
                        <button onclick="deleteTransaction(${t.id})" style="width: auto; background-color: #dc3545; padding: 5px 10px; margin: 0;">刪除</button>
                    </div>
                `;
            });
        }

        // 3. 呼叫刪除 API
        async function deleteTransaction(id) {
            if(confirm("確定要刪除這筆紀錄嗎？")) {
                await fetch(`/transactions/${id}`, { method: 'DELETE' });
                loadTransactions(); // 刪除後重新載入列表
                loadStatistics();   // 🔴 刪除後更新統計面板
            }
        }

        // 4. 送出表單新增記帳
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = document.getElementById('amount').value;
            const category = document.getElementById('category').value;
            const subcategory = document.getElementById('subcategory').value;
            const merchant = document.getElementById('merchant').value;
            const payment_method = document.getElementById('payment_method').value;
            const note = document.getElementById('note').value;

            await fetch(`/transactions?amount=${amount}&category=${category}&subcategory=${subcategory}&merchant=${merchant}&payment_method=${payment_method}&note=${note}`, {
                method: 'POST'
            });

            document.getElementById('expenseForm').reset();
            loadTransactions(); // 新增後重新載入列表
            loadStatistics();   // 🔴 新增後更新統計面板
        });

        // 5. 網頁剛開啟時，第一次載入資料
        loadTransactions(); 
        loadStatistics();   // 🔴 網頁打開時載入統計面板
    </script>
</body>
</html>
