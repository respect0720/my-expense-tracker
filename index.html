<!DOCTYPE html>
<html>
<head>
    <title>我的記帳系統</title>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .expense-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        
        /* 左右排版容器 */
        .container { display: flex; gap: 20px; }
        .sidebar { flex: 1; }
        .main-content { flex: 2; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }
        .month-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 主頁面左右排版 -->
    <div class="container">
        
        <!-- 左側：年度每月統計 -->
        <div class="sidebar">
            <div class="card">
                <h3>📅 今年各月收支</h3>
                <div id="monthlyList">載入中...</div>
            </div>
        </div>

        <!-- 右側：當月大面板與明細 -->
        <div class="main-content">
            <!-- Dashboard 統計面板 -->
            <div class="card" style="text-align: center;">
                <h3 style="color: #666; margin-bottom: 5px;">本月結餘</h3>
                <h1 id="balance" style="color: #007bff; margin-top: 0; margin-bottom: 15px;">$0</h1>
                <div style="display: flex; justify-content: space-around;">
                    <div>
                        <span style="color: #666;">本月收入：</span>
                        <span id="monthIncome" style="color: #28a745; font-weight: bold;">$0</span>
                    </div>
                    <div>
                        <span style="color: #666;">本月支出：</span>
                        <span id="monthExpense" style="color: #dc3545; font-weight: bold;">$0</span>
                    </div>
                </div>
            </div>

            <!-- 匯出按鈕 -->
            <button onclick="window.location.href='/export/excel'" style="background-color: #28a745; margin-bottom: 20px; font-size: 16px; color: white;">
                📊 下載 Excel 報表
            </button>   

            <!-- 最近交易紀錄 -->
            <div class="card">
                <h2>最近交易</h2>
                <div id="transactionList"></div>
            </div>
        </div>

    </div>

    <script>
        // 1. 讀取當月統計數據
        async function loadStatistics() {
            const response = await fetch('/statistics');
            const data = await response.json();
            document.getElementById('balance').innerText = `$${data.balance}`;
            document.getElementById('monthIncome').innerText = `$${data.month_income}`;
            document.getElementById('monthExpense').innerText = `$${data.month_expense}`;
        }

        // 2. 讀取今年各月統計數據並顯示在左側
        async function loadMonthlyStatistics() {
            const response = await fetch('/statistics/monthly');
            const data = await response.json();
            const monthlyList = document.getElementById('monthlyList');
            monthlyList.innerHTML = '';

            data.forEach(m => {
                // 如果該月份完全沒有收支，可以選擇跳過或顯示 0，這裡全部顯示
                monthlyList.innerHTML += `
                    <div class="month-row">
                        <span style="font-weight: bold; color: #444;">${m.month}</span>
                        <span>收: <span style="color: #28a745;">$${m.income}</span></span>
                        <span>支: <span style="color: #dc3545;">$${m.expense}</span></span>
                    </div>
                `;
            });
        }

        // 3. 取得所有交易紀錄
        async function loadTransactions() {
            const response = await fetch('/transactions');
            const data = await response.json();
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            
            data.forEach(t => {
                const amountColor = t.type === 'income' ? '#28a745' : '#dc3545';
                const sign = t.type === 'income' ? '+' : '-';
                
                let details = `[${t.category}]`;
                if (t.subcategory) details += ` / ${t.subcategory}`;
                if (t.payment_method) details += ` 💳 ${t.payment_method}`;
                if (t.note) details += ` 📝 ${t.note}`;

                list.innerHTML += `
                    <div class="expense-item" style="align-items: center; padding: 12px 0;">
                        <div style="flex-grow: 1; padding-right: 10px;">
                            <div style="font-size: 12px; color: #888; margin-bottom: 3px;">${t.date}</div>
                            <div style="font-size: 14px; color: #333; font-weight: 500;">${details}</div>
                        </div>
                        <span style="color: ${amountColor}; font-weight: bold; font-size: 16px; margin-right: 15px; white-space: nowrap;">${sign}$${t.amount}</span>
                        <button onclick="deleteTransaction(${t.id})" style="width: auto; background-color: #dc3545; color: white; padding: 5px 10px; margin: 0;">刪除</button>
                    </div>
                `;
            });
        }

        // 4. 刪除交易
        async function deleteTransaction(id) {
            if(confirm("確定要刪除這筆紀錄嗎？")) {
                await fetch(`/transactions/${id}`, { method: 'DELETE' });
                loadTransactions(); 
                loadStatistics();
                loadMonthlyStatistics();
            }
        }

        // 初始化載入
        loadTransactions(); 
        loadStatistics();
        loadMonthlyStatistics();
    </script>
</body>
</html>
