<!DOCTYPE html>
<html>
<head>
    <title>我的記帳系統</title>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; max-width: 1050px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; cursor: pointer; font-weight: bold; }
        button { background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        .expense-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        
        /* 左右排版 (左側加寬讓六位數金額完美對齊) */
        .container { display: flex; gap: 20px; }
        .sidebar { flex: 1.2; min-width: 310px; }
        .main-content { flex: 2; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
        }

        /* 網格對齊排版：月份、收入、支出固定欄位並靠右對齊 */
        .month-row { 
            display: grid; 
            grid-template-columns: 50px 1fr 1fr; 
            align-items: center; 
            padding: 9px 0; 
            border-bottom: 1px solid #f0f0f0; 
            font-size: 14px; 
        }
        .month-name { font-weight: bold; color: #444; }
        .month-val-income { text-align: right; color: #28a745; font-variant-numeric: tabular-nums; }
        .month-val-expense { text-align: right; color: #dc3545; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 左側：年度每月統計 -->
        <div class="sidebar">
            <div class="card">
                <h3>📅 今年各月收支</h3>
                <div style="font-size: 12px; color: #888; display: grid; grid-template-columns: 50px 1fr 1fr; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-bottom: 5px;">
                    <span>月份</span>
                    <span style="text-align: right;">收入</span>
                    <span style="text-align: right;">支出</span>
                </div>
                <div id="monthlyList">載入中...</div>
            </div>
        </div>

        <!-- 右側：當月大面板、圓餅圖、歷史查詢與明細 -->
        <div class="main-content">
            <!-- Dashboard 統計面板 -->
            <div class="card" style="text-align: center;">
                <h3 style="color: #666; margin-bottom: 5px;">本月結餘</h3>
                <h1 id="balance" style="color: #007bff; margin-top: 0; margin-bottom: 15px;">$0</h1>
                <div style="display: flex; justify-content: space-around;">
                    <div>
                        <span style="color: #666;">本月收入：</span>
                        <span id="monthIncome" style="color: #28a745; font-weight: bold;">$0</span>
                    </div>
                    <div>
                        <span style="color: #666;">本月支出：</span>
                        <span id="monthExpense" style="color: #dc3545; font-weight: bold;">$0</span>
                    </div>
                </div>
            </div>

            <!-- 圓餅圖卡片 -->
            <div class="card">
                <h3 style="text-align: center; color: #444; margin-bottom: 15px;">📊 本月分類支出佔比</h3>
                <div style="width: 100%; max-width: 300px; margin: auto;">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- 歷史紀錄查詢面板 -->
            <div class="card">
                <h3>🔍 歷史紀錄查詢</h3>
                <div style="display: flex; gap: 10px;">
                    <select id="selectYear"></select>
                    <select id="selectMonth">
                        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
                        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
                        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
                        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                    </select>
                </div>
                <button onclick="loadHistory()">查詢該月紀錄</button>
                
                <div id="historyResult" style="margin-top: 15px; display: none;">
                    <div style="background: #f8f9fa; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 10px;">
                        <span style="color: #666;">該月結餘：</span><span id="histBalance" style="font-weight: bold; color: #007bff;">$0</span> | 
                        <span style="color: #28a745;">收: $<span id="histIncome">0</span></span> | 
                        <span style="color: #dc3545;">支: $<span id="histExpense">0</span></span>
                    </div>
                    <div id="historyList"></div>
                </div>
            </div>

            <!-- 匯出按鈕 -->
            <button onclick="window.location.href='/export/excel'" style="background-color: #28a745; margin-bottom: 20px; font-size: 16px; color: white;">
                📊 下載 Excel 報表
            </button>   

            <!-- 最近交易紀錄 -->
            <div class="card">
                <h2>最近交易 (當月)</h2>
                <div id="transactionList"></div>
            </div>
        </div>

    </div>

    <script>
        let myChart = null;

        // 自動動態產生年份選項 (從今年開始往回推 5 年)
        const now = new Date();
        const currentYear = now.getFullYear();
        const yearSelect = document.getElementById('selectYear');
        for (let y = currentYear; y >= currentYear - 5; y--) {
            let opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y + "年";
            yearSelect.appendChild(opt);
        }
        yearSelect.value = currentYear;
        document.getElementById('selectMonth').value = now.getMonth() + 1;

        async function loadStatistics() {
            const response = await fetch('/statistics');
            const data = await response.json();
            document.getElementById('balance').innerText = `$${data.balance}`;
            document.getElementById('monthIncome').innerText = `$${data.month_income}`;
            document.getElementById('monthExpense').innerText = `$${data.month_expense}`;
        }

        async function loadMonthlyStatistics() {
            const response = await fetch('/statistics/monthly');
            const data = await response.json();
            const monthlyList = document.getElementById('monthlyList');
            monthlyList.innerHTML = '';

            data.forEach(m => {
                monthlyList.innerHTML += `
                    <div class="month-row">
                        <span class="month-name">${m.month}</span>
                        <span class="month-val-income">+$${m.income.toLocaleString()}</span>
                        <span class="month-val-expense">-$${m.expense.toLocaleString()}</span>
                    </div>
                `;
            });
        }

        async function loadCategoryChart() {
            const response = await fetch('/statistics/category');
            const data = await response.json();
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.categories,
                    datasets: [{
                        data: data.amounts,
                        backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#4bc0c0', '#9966ff', '#ff9f40', '#c9cbcf']
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        async function loadTransactions() {
            const response = await fetch('/transactions');
            const data = await response.json();
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            
            data.forEach(t => {
                const amountColor = t.type === 'income' ? '#28a745' : '#dc3545';
                const sign = t.type === 'income' ? '+' : '-';
                
                let details = `[${t.category}]`;
                if (t.subcategory) details += ` / ${t.subcategory}`;
                if (t.payment_method) details += ` 💳 ${t.payment_method}`;
                if (t.note) details += ` 📝 ${t.note}`;

                list.innerHTML += `
                    <div class="expense-item" style="align-items: center; padding: 12px 0;">
                        <div style="flex-grow: 1; padding-right: 10px;">
                            <div style="font-size: 12px; color: #888; margin-bottom: 3px;">${t.date}</div>
                            <div style="font-size: 14px; color: #333; font-weight: 500;">${details}</div>
                        </div>
                        <span style="color: ${amountColor}; font-weight: bold; font-size: 16px; margin-right: 15px; white-space: nowrap;">${sign}$${t.amount.toLocaleString()}</span>
                        <button onclick="deleteTransaction(${t.id})" style="width: auto; background-color: #dc3545; color: white; padding: 5px 10px; margin: 0;">刪除</button>
                    </div>
                `;
            });
        }

        async function loadHistory() {
            const year = document.getElementById('selectYear').value;
            const month = document.getElementById('selectMonth').value;
            
            const response = await fetch(`/statistics/history?year=${year}&month=${month}`);
            const data = await response.json();
            
            document.getElementById('histBalance').innerText = `$${data.balance.toLocaleString()}`;
            document.getElementById('histIncome').innerText = data.income.toLocaleString();
            document.getElementById('histExpense').innerText = data.expense.toLocaleString();
            
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            if (data.transactions.length === 0) {
                historyList.innerHTML = `<div style="text-align: center; color: #888; padding: 10px;">該月份無記帳紀錄</div>`;
            } else {
                data.transactions.forEach(t => {
                    const amountColor = t.type === 'income' ? '#28a745' : '#dc3545';
                    const sign = t.type === 'income' ? '+' : '-';
                    
                    let details = `[${t.category}]`;
                    if (t.subcategory) details += ` / ${t.subcategory}`;
                    if (t.payment_method) details += ` 💳 ${t.payment_method}`;
                    if (t.note) details += ` 📝 ${t.note}`;

                    historyList.innerHTML += `
                        <div class="expense-item" style="align-items: center; padding: 8px 0;">
                            <div style="flex-grow: 1; padding-right: 10px;">
                                <div style="font-size: 11px; color: #888;">${t.date}</div>
                                <div style="font-size: 13px; color: #333;">${details}</div>
                            </div>
                            <span style="color: ${amountColor}; font-weight: bold; font-size: 14px; white-space: nowrap;">${sign}$${t.amount.toLocaleString()}</span>
                        </div>
                    `;
                });
            }
            
            document.getElementById('historyResult').style.display = 'block';
        }

        async function deleteTransaction(id) {
            if(confirm("確定要刪除這筆紀錄嗎？")) {
                await fetch(`/transactions/${id}`, { method: 'DELETE' });
                loadTransactions(); 
                loadStatistics();
                loadMonthlyStatistics();
                loadCategoryChart();
            }
        }

        loadTransactions(); 
        loadStatistics();
        loadMonthlyStatistics();
        loadCategoryChart();
    </script>
</body>
</html>
